name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the app (wrangler dev, local mode)
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 2; done

      - name: Playwright (API, Chromium, Firefox, WebKit, mobile)
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8787

      - name: Postman collection with Newman
        if: always()
        run: npm run postman

      - name: Summary
        if: always()
        run: npm run report:summary

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            site/reports/
            wrangler.log
          retention-days: 14
